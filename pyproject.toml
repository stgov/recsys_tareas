[project]
name = "tareas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <=3.14"
dependencies = [
    "implicit>=0.7.3",
    "ipython>=9.16.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "surprise>=0.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.15.19",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**"]
